name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    env:
      # Job-level env supaya bisa dibaca di kondisi `if:` step (lihat catatan
      # GitHub Actions: secrets tidak bisa dicek langsung di `if:`, harus
      # lewat env dulu).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo ini SENGAJA tidak menyertakan gradlew/gradle-wrapper.jar (dibuat di
      # sandbox tanpa akses internet ke services.gradle.org). setup-gradle
      # menyediakan binari `gradle` yang versinya sudah ditentukan di sini +
      # caching dependency otomatis.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test :core (logika sinkronisasi murni)
        run: gradle :core:test --stacktrace

      - name: Unit test :app
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kuronoa-expense-tracker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build release APK
        env:
          KURONOA_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && 'keystore/release.keystore' || '' }}
          KURONOA_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KURONOA_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KURONOA_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename release APK dgn versi
        run: |
          mkdir -p dist
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "dist/KuronoaExpenseTracker-v${VERSION_NAME}.apk" \;
          ls -la dist

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kuronoa-expense-tracker-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release (hanya saat push tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            APK Kuronoa Expense Tracker — by drummergimbal.

            Cara instal: unduh file .apk di bawah ini ke HP Android, buka file-nya,
            izinkan "Install dari sumber tidak dikenal" jika diminta, lalu ikuti
            proses instalasi. Lihat docs/PANDUAN_RILIS.md untuk panduan lengkap
            (termasuk cara sambungkan ke Google Sheets Anda sendiri).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
